<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Starmark</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header class="top-bar">
      <div class="top-bar-inner">
        <h1 class="top-bar-title">Starmark</h1>
        <button id="projects-menu-btn" type="button" class="top-bar-btn">
          Projects
        </button>
      </div>
    </header>

    <dialog id="projects-dialog" class="projects-dialog">
      <div class="dialog-header">
        <h2>Projects</h2>
        <button id="projects-dialog-close" type="button" class="dialog-close" aria-label="Close">
          &times;
        </button>
      </div>

      <section class="picker">
        <label for="folder-path">Astro project folder</label>
        <div class="picker-row">
          <input
            id="folder-path"
            type="text"
            placeholder="/path/to/your/astro-site"
            spellcheck="false"
          />
          <button id="browse-btn" type="button">Browse…</button>
          <button id="scan-btn" type="button" class="primary">Scan</button>
        </div>
        <p id="scan-info" class="scan-info" hidden></p>
      </section>

      <section id="projects-section" class="projects" hidden>
        <h3 class="projects-heading">Remembered</h3>
        <ul id="project-list" class="project-list"></ul>
      </section>
    </dialog>

    <main class="container">
      <section id="list-view" class="results">
        <div class="results-header">
          <h2>Content &amp; pages</h2>
          <span id="file-count" class="file-count"></span>
        </div>
        <div id="search-box" class="search-box" hidden>
          <input
            id="file-search"
            type="search"
            placeholder="Filter files…"
            spellcheck="false"
            aria-label="Filter files"
          />
        </div>
        <p id="empty-state" class="empty-state">
          Open Projects to choose a folder and scan for <code>.md</code> and
          <code>.mdx</code> files.
        </p>
        <ul id="file-list" class="file-tree" hidden></ul>
      </section>

      <section id="edit-view" class="edit-view" hidden>
        <div class="edit-sticky-bar">
          <div class="edit-header">
            <button id="edit-back-btn" type="button" class="edit-back-btn" aria-label="Back to file list">
              <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true">
                <path fill="currentColor" d="M10.5 3.5 5 8l5.5 4.5-.875 1.125L3.25 8l6.375-5.625z"/>
              </svg>
              Back
            </button>
            <div class="edit-file-info">
              <h2 id="edit-file-name" class="edit-file-name"></h2>
              <p id="edit-file-path" class="edit-file-path"></p>
            </div>
          </div>
          <div class="edit-toolbar" role="toolbar" aria-label="Editor toolbar">
            <div class="toolbar-group">
              <button id="bold-btn" type="button" class="toolbar-btn" aria-label="Bold">
                <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true">
                  <path fill="currentColor" d="M4 2.5h4.25c1.8 0 3 1.05 3 2.55 0 1.05-.55 1.85-1.45 2.25 1.15.35 1.95 1.3 1.95 2.55 0 1.75-1.35 2.65-3.35 2.65H4V2.5Zm2 3.65h2.1c.75 0 1.2-.4 1.2-1s-.45-1-1.2-1H6v2Zm0 4.35h2.45c.85 0 1.35-.45 1.35-1.15 0-.7-.5-1.15-1.35-1.15H6v2.3Z"/>
                </svg>
              </button>
              <button id="italic-btn" type="button" class="toolbar-btn" aria-label="Italic">
                <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true">
                  <path fill="currentColor" d="M6.5 2.5h5v1.5H9.8l-2.1 9h2.8v1.5h-5v-1.5h1.7l2.1-9H6.5V2.5Z"/>
                </svg>
              </button>
              <button id="strikethrough-btn" type="button" class="toolbar-btn" aria-label="Strikethrough">
                <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true">
                  <text x="8" y="11.5" text-anchor="middle" fill="currentColor" font-size="11" font-weight="600" font-family="ui-sans-serif, system-ui, sans-serif">S</text>
                  <rect x="3" y="7.5" width="10" height="1.25" rx="0.25" fill="currentColor"/>
                </svg>
              </button>
            </div>
            <div class="toolbar-separator" role="separator" aria-orientation="vertical"></div>
            <div class="toolbar-group">
            <button id="link-btn" type="button" class="toolbar-btn" aria-label="Insert link">
              <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true">
                <path fill="currentColor" d="M7.775 3.275 9.025 2.025a3.5 3.5 0 1 1 4.95 4.95l-2.5 2.5a3.5 3.5 0 0 1-4.95 0 .751.751 0 0 1 .018-1.042.751.751 0 0 1 1.042-.018 1.998 1.998 0 0 0 2.83 0l2.5-2.5a2.002 2.002 0 0 0-2.83-2.83l-1.25 1.25a.751.751 0 0 1-1.042-.018.751.751 0 0 1-.018-1.042Zm-4.69 9.64a1.998 1.998 0 0 0 2.83 0l1.25-1.25a.751.751 0 0 1 1.042.018.751.751 0 0 1 .018 1.042l-1.25 1.25a3.5 3.5 0 1 1-4.95-4.95l2.5-2.5a3.5 3.5 0 0 1 4.95 0 .751.751 0 0 1-.018 1.042.751.751 0 0 1-1.042.018 1.998 1.998 0 0 0-2.83 0l-2.5 2.5a1.998 1.998 0 0 0 0 2.83Z"/>
              </svg>
            </button>
            <button id="image-btn" type="button" class="toolbar-btn" aria-label="Insert image">
              <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true">
                <path fill="currentColor" d="M2.5 3A1.5 1.5 0 0 0 1 4.5v7A1.5 1.5 0 0 0 2.5 13h11a1.5 1.5 0 0 0 1.5-1.5v-7A1.5 1.5 0 0 0 13.5 3h-11ZM2 4.5a.5.5 0 0 1 .5-.5h11a.5.5 0 0 1 .5.5v7a.5.5 0 0 1-.5.5h-11a.5.5 0 0 1-.5-.5v-7Zm9.053 2.853-2.5 3a.5.5 0 0 1-.786.043L5.847 8.207 3.853 10.5a.5.5 0 0 1-.853-.354.5.5 0 0 1 .146-.396l2.25-2.625a.5.5 0 0 1 .786-.043l1.87 2.189 2.147-2.576a.5.5 0 0 1 .804.058ZM5.5 6a1 1 0 1 0 0-2 1 1 0 0 0 0 2Z"/>
              </svg>
            </button>
            </div>
          </div>
        </div>
        <div
          id="markdown-editor"
          class="markdown-editor"
          contenteditable="true"
          spellcheck="false"
          role="textbox"
          aria-multiline="true"
          aria-labelledby="edit-file-name"
        ></div>
      </section>
    </main>

    <dialog id="link-dialog" class="link-dialog">
      <div class="dialog-header">
        <h2>Insert link</h2>
        <button id="link-dialog-close" type="button" class="dialog-close" aria-label="Close">
          &times;
        </button>
      </div>
      <form id="link-form" class="link-form">
        <div class="link-field">
          <label for="link-text">Link text</label>
          <input id="link-text" type="text" autocomplete="off" spellcheck="false" />
        </div>
        <div class="link-field">
          <label for="link-url">URL</label>
          <input id="link-url" type="text" autocomplete="off" spellcheck="false" />
        </div>
        <div class="link-form-actions">
          <button type="submit" class="primary">Done</button>
        </div>
      </form>
    </dialog>

    <dialog id="media-dialog" class="media-dialog">
      <div class="dialog-header">
        <h2>Insert image</h2>
        <button id="media-dialog-close" type="button" class="dialog-close" aria-label="Close">
          &times;
        </button>
      </div>
        <div id="media-browser-view" class="media-browser">
        <div class="media-toolbar">
          <button id="media-up-btn" type="button" class="media-up-btn" disabled aria-label="Go up one folder">
            <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true">
              <path fill="currentColor" d="M8 3.5 3.5 8 5 9.5 7.25 7.25V12.5h1.5V7.25L10.5 9.5 12 8z"/>
            </svg>
            Up
          </button>
          <nav id="media-breadcrumb" class="media-breadcrumb" aria-label="Media path"></nav>
        </div>
        <p id="media-status" class="media-status" hidden></p>
        <div id="media-contents" class="media-contents">
          <ul id="media-folders" class="media-folders"></ul>
          <div id="media-images" class="media-images"></div>
        </div>
      </div>
      <form id="image-form" class="image-form" hidden aria-hidden="true">
        <p id="image-selected-name" class="image-selected-name"></p>
        <div class="link-field">
          <label for="image-alt">Alt text</label>
          <input id="image-alt" type="text" autocomplete="off" spellcheck="true" />
        </div>
        <label class="image-checkbox-field" for="image-lazy">
          <input id="image-lazy" type="checkbox" checked />
          Lazy load
        </label>
        <div class="link-field">
          <label for="image-caption">Caption</label>
          <input id="image-caption" type="text" autocomplete="off" spellcheck="true" />
        </div>
        <div class="link-form-actions image-form-actions">
          <button id="image-back-btn" type="button">Back</button>
          <button type="submit" class="primary">Done</button>
        </div>
      </form>
    </dialog>

    <script src="/app.js" type="module"></script>
  </body>
</html>
